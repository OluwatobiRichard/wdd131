<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form For Viewing Product</title>
    <meta name="description" content="WDD 131 – Dynamic form page for Ojo Olwatobi Richard.">
    <meta name="author" content="Ojo Olwatobi Richard">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <div class="card">
        <header>
            <h1>Product Review</h1>
        </header>

        <main>
            <form action="review.html" method="get">

                <div class="field">
                    <label for="product">Product Name</label>
                    <select id="product" name="product" required>
                        <option value="" disabled selected>Select a Product ...</option>
                    </select>
                </div>

                <fieldset class="stars-fieldset">
                    <legend>Overall Rating</legend>
                    <div class="stars">
                        <div class="star-option">
                            <label for="star1">★</label>
                            <input type="radio" id="star1" name="rating" value="1" required>
                        </div>
                        <div class="star-option">
                            <label for="star2">★★</label>
                            <input type="radio" id="star2" name="rating" value="2" required>
                        </div>
                        <div class="star-option">
                            <label for="star3">★★★</label>
                            <input type="radio" id="star3" name="rating" value="3" required>
                        </div>
                        <div class="star-option">
                            <label for="star4">★★★★</label>
                            <input type="radio" id="star4" name="rating" value="4" required>
                        </div>
                        <div class="star-option">
                            <label for="star5">★★★★★</label>
                            <input type="radio" id="star5" name="rating" value="5" required>
                        </div>
                    </div>
                </fieldset>

                <div class="field date">
                    <label for="installDate">Date of Installation</label>
                    <input type="date" id="installDate" name="installDate" required>
                </div>

                <fieldset class="features">
                    <legend>
                        Which features did you find useful in the product?
                        <span class="optional-note">(Check all that apply)</span>
                    </legend>

                    <div class="checkbox-row">
                        <input type="checkbox" id="durability" name="usefulFeatures" value="Durability">
                        <label for="durability">Durability</label>
                    </div>

                    <div class="checkbox-row">
                        <input type="checkbox" id="easySetup" name="usefulFeatures" value="Easy Setup">
                        <label for="easySetup">Ease of Use</label>
                    </div>

                    <div class="checkbox-row">
                        <input type="checkbox" id="performance" name="usefulFeatures" value="Performance">
                        <label for="performance">Performance</label>
                    </div>

                    <div class="checkbox-row">
                        <input type="checkbox" id="design" name="usefulFeatures" value="Design">
                        <label for="design">Design</label>
                    </div>
                </fieldset>

                <div class="field">
                    <label for="writtenReview">Written Review <span class="optional-note">(Optional)</span></label>
                    <textarea id="writtenReview" name="writtenReview" rows="4"
                        placeholder="Write your review here..."></textarea>
                </div>

                <div class="field">
                    <label for="userName">Your Name <span class="optional-note">(Optional)</span></label>
                    <input type="text" id="userName" name="userName" placeholder="Enter your name">
                </div>

                <input type="submit" value="Post Review" class="submit-btn">
            </form>
        </main>

        <footer>
            <p>
                &copy;<span id="currentyear"></span>
                🌺 Ojo Oluwatobi Richard 🌺
                <br>
                FCT Abuja, Nigeria
            </p>
            <p id="lastModified"></p>
        </footer>
    </div>
</body>

</html>
